<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>销售工作台 · 保函 / 团险 / 车险</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
    --brand:#2563eb; --brand2:#0ea5e9; --green:#10b981; --amber:#f59e0b; --red:#ef4444;
    --slate:#64748b; --chip:#eef2ff; --shadow:0 1px 3px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  #app{display:flex;min-height:100vh}
  /* 侧边导航 */
  .sidebar{width:188px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:16px 14px 10px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--brand),var(--brand2))}
  .brand small{display:block;font-weight:400;color:var(--sub);font-size:11px;margin-top:2px}
  .nav{padding:6px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
  .nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;color:var(--sub);text-decoration:none;font-weight:500}
  .nav a .ic{width:18px;height:18px;flex:none}
  .nav a.active{background:var(--chip);color:var(--brand);font-weight:600}
  .nav a:hover{background:#f1f5f9}
  .nav .foot{margin-top:auto;padding:10px 11px;color:var(--sub);font-size:11px;border-top:1px solid var(--line)}
  /* 主区 */
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header.top{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header.top h1{margin:0;font-size:18px;font-weight:700}
  header.top p{margin:2px 0 0;color:var(--sub);font-size:12px}
  #view{padding:16px 20px 40px;max-width:1180px;width:100%}
  /* 卡片/栅格 */
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,1fr)} .sidebar{width:64px}.sidebar .label,.brand small,.nav .foot{display:none}.brand{justify-content:center}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 10px;font-size:15px;font-weight:700}
  .stat{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:12px;background:#f8fafc}
  .stat .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .stat .l{font-size:12px;color:var(--sub)}
  .quick{display:flex;flex-direction:column;justify-content:center;gap:8px;color:#fff;border:none;cursor:pointer;text-align:left;min-height:92px;border-radius:14px;padding:14px}
  .quick.blue{background:linear-gradient(135deg,var(--brand),#1d4ed8)}
  .quick.green{background:linear-gradient(135deg,#10b981,#059669)}
  .quick.amber{background:linear-gradient(135deg,#f59e0b,#d97706)}
  .quick.sky{background:linear-gradient(135deg,#0ea5e9,#0284c7)}
  .quick .t{font-weight:700;font-size:15px} .quick .s{font-size:11px;opacity:.85}
  /* 标签 */
  .badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .b-bh{background:#eff6ff;color:#2563eb} .b-tx{background:#ecfdf5;color:#059669} .b-cx{background:#fff7ed;color:#ea580c}
  .b-soe{background:#faf5ff;color:#7e22ce} .b-pri{background:#fef2f2;color:#dc2626}
  .st{display:inline-flex;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .st-0{background:#f1f5f9;color:#475569} .st-1{background:#eff6ff;color:#2563eb}
  .st-2{background:#fef9c3;color:#a16207} .st-3{background:#ecfdf5;color:#059669} .st-4{background:#fef2f2;color:#dc2626}
  /* 表单 */
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px;font-weight:600}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  textarea{resize:vertical;min-height:64px}
  .btn{border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
  .btn:hover{filter:brightness(.96)} .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:#f8fafc} .btn.sm{padding:6px 10px;font-size:12px} .btn.block{width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1;min-width:120px}
  /* 客户/列表 */
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
  .item .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .item .name{font-weight:700;font-size:15px}
  .item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--sub);font-size:12px}
  .phones{display:flex;flex-wrap:wrap;gap:6px}
  .ph{display:inline-flex;align-items:center;gap:5px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px}
  .ph .src{font-size:10px;color:var(--slate);background:#eef2f7;border-radius:4px;padding:0 4px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar input,.toolbar select{max-width:200px}
  .seg{display:inline-flex;background:#eef2f7;border-radius:9px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;padding:6px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer}
  .seg button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow)}
  .empty{text-align:center;color:var(--sub);padding:30px}
  /* 抽屉 */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;z-index:20}
  .mask.open{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:440px;max-width:92vw;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s;z-index:21;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .drawer .body{padding:14px 16px;overflow:auto;flex:1}
  .drawer .x{border:none;background:#f1f5f9;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px}
  .sub-h{font-size:12px;color:var(--sub);font-weight:700;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  /* 报价结果 */
  .result{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:12px}
  .result .big{font-size:26px;font-weight:800;color:#047857}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--sub)} .kv .v{font-weight:600}
  /* 车险优惠计算器 */
  .cx-table{width:100%;border-collapse:collapse;margin-top:4px}
  .cx-table th{font-size:12px;color:var(--sub);font-weight:700;text-align:left;padding:7px 6px;background:#f8fafc;border-bottom:1px solid var(--line)}
  .cx-table td{padding:6px 4px;border-bottom:1px dashed var(--line);font-size:13px}
  .cx-table td:first-child{font-weight:600;white-space:nowrap}
  .cx-table input{padding:7px 8px;text-align:right;font-size:13px}
  .cx-panel{background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:10px 12px;margin-top:12px}
  .cx-tag{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;margin-right:2px}
  .cx-tag.t-a{background:#2563eb} .cx-tag.t-b{background:#8b5cf6}
  .cx-taxrow{display:flex;align-items:center;gap:9px;margin:10px 0 2px;font-size:12px;color:var(--sub)}
  .switch{position:relative;display:inline-block;width:38px;height:21px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:999px;transition:.2s}
  .slider:before{content:"";position:absolute;height:15px;width:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--brand)}
  .switch input:checked + .slider:before{transform:translateX(17px)}
  /* toast */
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast{background:#111827;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .2s}
  .toast.ok{background:#047857} .toast.err{background:#b91c1c}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .muted{color:var(--sub)} .right{text-align:right} .center{text-align:center}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef2f7;color:var(--slate);font-weight:600}
  .link{color:var(--brand);cursor:pointer;font-weight:600}
  .timeline{display:flex;gap:6px;flex-wrap:wrap}
  .timeline button{flex:1;min-width:64px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:600;cursor:pointer;color:var(--sub)}
  .timeline button.on{background:var(--chip);color:var(--brand);border-color:#c7d2fe}
  .skip{color:var(--sub);font-size:12px;margin-top:8px;cursor:pointer;text-decoration:underline}
</style>
















<style id="ax-design">
/* ============================ 1. 设计令牌 ============================ */
:root{
  /* 画布 / 文字 */
  --ax-bg:#F1F5FC;
  --ax-card:#FFFFFF;
  --ax-ink:#16203A;
  --ax-ink-2:#5C6884;
  --ax-ink-3:#93A0BA;
  --ax-line:#EDF1F9;

  /* 主色与功能色 */
  --ax-primary:#6C5CE7;
  --ax-primary-soft:rgba(108,92,231,.10);
  --ax-blue:#3D7BF0;
  --ax-green:#22C55E;
  --ax-orange:#F59E0B;
  --ax-red:#EF4444;
  --ax-teal:#14B8A6;
  --ax-pink:#F76C9E;

  /* 渐变 */
  --ax-g-blue:linear-gradient(135deg,#6AA5FF 0%,#3D7BF0 100%);
  --ax-g-indigo:linear-gradient(135deg,#8B7CF6 0%,#6C5CE7 100%);
  --ax-g-green:linear-gradient(135deg,#5BE08E 0%,#22C55E 100%);
  --ax-g-orange:linear-gradient(135deg,#FBC55F 0%,#F59E0B 100%);
  --ax-g-red:linear-gradient(135deg,#FB7E8E 0%,#EF4444 100%);
  --ax-g-teal:linear-gradient(135deg,#4DD9CE 0%,#14B8A6 100%);
  --ax-g-pink:linear-gradient(135deg,#FCA5C4 0%,#F76C9E 100%);

  /* 形状 */
  --ax-r-lg:20px; --ax-r-md:16px; --ax-r-sm:11px; --ax-r-xs:8px;
  --ax-shadow:0 8px 24px rgba(66,84,140,.07);
  --ax-shadow-sm:0 3px 12px rgba(66,84,140,.05);
  --ax-shadow-hover:0 14px 34px rgba(66,84,140,.13);

  /* 覆盖存量页面常用的旧变量名（尽量让老 CSS 也跟着变色） */
  --primary:#6C5CE7; --primary-color:#6C5CE7;
  --accent:#3D7BF0;
  --bg:#F1F5FC; --background:#F1F5FC;
  --card-bg:#FFFFFF; --surface:#FFFFFF;
  --text:#16203A; --text-color:#16203A;
  --border-color:#EDF1F9;
  --radius:16px; --radius-lg:20px;
  --shadow:0 8px 24px rgba(66,84,140,.07);
}

/* ============================ 2. 画布 ============================ */
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Inter,sans-serif !important;
  color:var(--ax-ink);
  background-color:#EDF3FB !important;
  background-image:
    radial-gradient(46% 40% at 3% 0%,  rgba(122,168,255,.26), transparent 60%),
    radial-gradient(42% 34% at 98% 1%, rgba(150,132,255,.20), transparent 62%),
    radial-gradient(46% 40% at 94% 100%, rgba(94,214,220,.16), transparent 62%),
    linear-gradient(160deg,#EAF2FD 0%,#F3F6FE 46%,#EDF6FB 100%) !important;
  background-attachment:fixed !important;
  background-repeat:no-repeat !important;
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
}

/* 可选：整体色相柔化（不改结构，只做统一） */
::selection{ background:rgba(61,123,240,.22); color:var(--ax-ink); }

/* 滚动条 —— 细、圆、低存在感 */
*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#CFD9EC,#B9C6E0);
  border-radius:999px; border:2.5px solid transparent; background-clip:content-box;
}
*::-webkit-scrollbar-thumb:hover{ background:#9FB0D0; background-clip:content-box; }
*{ scrollbar-width:thin; scrollbar-color:#C6D2E8 transparent; }

a{ color:inherit; }

/* ============================ 3. 通用元素 ============================ */

/* --- 标题层次 --- */
h1{ font-size:22px; font-weight:800; letter-spacing:.2px; color:var(--ax-ink); }
h2{ font-size:17px; font-weight:800; letter-spacing:.2px; color:var(--ax-ink); }
h3{ font-size:15px; font-weight:750; color:var(--ax-ink); }
h4{ font-size:13.5px; font-weight:700; color:var(--ax-ink-2); }

/* --- 按钮 --- */
button, .btn, input[type=button], input[type=submit], [class*="btn-"]{
  font-family:inherit;
  border-radius:var(--ax-r-sm);
  transition:transform .14s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
}
button:not([class*="icon"]):not([class*="close"]):hover,
.btn:hover{ transform:translateY(-1px); }
button:active, .btn:active{ transform:translateY(0) scale(.985); }
button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid rgba(108,92,231,.55); outline-offset:2px;
}
/* 主按钮：原来的实色蓝/绿/黑，统一成品牌渐变 */
.btn-primary, .btn.main, .primary, button.primary,
button[type=submit].btn:not(.btn-outline):not(.ghost){
  background:var(--ax-g-indigo) !important;
  color:#fff !important;
  border-color:transparent !important;
  box-shadow:0 8px 18px rgba(108,92,231,.30) !important;
}
.btn-primary:hover{ box-shadow:0 12px 24px rgba(108,92,231,.38) !important; }
/* 次按钮：白底描边 */
.btn-outline, .btn.ghost, button.ghost{
  background:#fff !important;
  color:var(--ax-ink-2) !important;
  border:1px solid var(--ax-line) !important;
  box-shadow:var(--ax-shadow-sm) !important;
}

/* --- 表单控件 --- */
input[type=text], input[type=password], input[type=email], input[type=number],
input[type=search], input[type=tel], input[type=url], input[type=date], select, textarea,
.form-control, .form-input{
  border-radius:var(--ax-r-sm) !important;
  border:1px solid var(--ax-line) !important;
  background:#fff !important;
  color:var(--ax-ink) !important;
  font-family:inherit !important;
  transition:border-color .16s, box-shadow .16s;
}
input:focus, select:focus, textarea:focus, .form-control:focus{
  border-color:rgba(108,92,231,.55) !important;
  box-shadow:0 0 0 3.5px rgba(108,92,231,.13) !important;
  outline:none !important;
}
input::placeholder, textarea::placeholder{ color:var(--ax-ink-3) !important; }

/* --- 表格 --- */
table{ border-collapse:collapse; }
thead th, table th{
  font-size:11.5px !important; font-weight:650 !important;
  color:var(--ax-ink-3) !important;
  background:transparent !important;
  border-bottom:1px solid var(--ax-line) !important;
}
td{ font-size:12.5px !important; color:var(--ax-ink-2) !important; border-bottom:1px solid var(--ax-line) !important; }
tbody tr:hover td{ background:#FAFCFF !important; }
tbody tr:last-child td{ border-bottom:0 !important; }

/* ============================ 4. 卡片族 ============================ */
/* 覆盖存量页面里各种卡片命名；只改外观，不改 display/position */
.card, .panel, .pcard, .stat-card, .prod-card, .cat-card, .game-card,
.client-card, .client-bid-card, .cloud-sheet-card, .ps-card,
.login-box, .auth-box, .modal-card, .modal-box, .login-card, .box-card,
[class$="-card"]:not([class*="card-"]):not(.card-icon):not(.card-hd){
  border-radius:var(--ax-r-lg) !important;
  background:var(--ax-card) !important;
  box-shadow:var(--ax-shadow) !important;
  border:1px solid rgba(237,241,249,.9) !important;
}
/* 卡片悬停：轻微抬起（仅对明显可点的卡） */
.game-card:hover, .prod-card:hover, .cat-card:hover, .client-card:hover,
.cloud-sheet-card:hover, [class$="-card"].clickable:hover{
  box-shadow:var(--ax-shadow-hover) !important;
  transform:translateY(-2px);
}

/* 小控件块（快速入口/工具项） */
.quick-item, .wi, .nav-card, .gn-item, .tool-item, .entry-item{
  border-radius:var(--ax-r-md) !important;
  background:#FAFCFF !important;
  border:1px solid var(--ax-line) !important;
  transition:transform .15s, box-shadow .15s, background .15s;
}
.quick-item:hover, .wi:hover, .tool-item:hover, .entry-item:hover{
  transform:translateY(-2px);
  box-shadow:var(--ax-shadow-sm) !important;
  background:#fff !important;
}

/* 顶部品牌横幅（hero）—— 统一成品牌柔彩 */
.hero-banner, .banner, .header-banner{
  border-radius:var(--ax-r-lg) !important;
  background:linear-gradient(135deg,#EEF3FF 0%,#F3F0FF 52%,#EAF7FF 100%) !important;
  border:1px solid rgba(237,241,249,.9) !important;
  box-shadow:var(--ax-shadow-sm) !important;
}

/* ============================ 5. 标签 / 徽章 ============================ */
.pill, .tag, .badge, .chip, .level-badge, .client-tag-badge, .member-tag,
[class$="-tag"]:not(.tag-row), [class$="-badge"]{
  border-radius:999px !important;
  font-weight:650 !important;
  border:0 !important;
}
/* 状态色统一（按常见语义命名兜底） */
.pill.ok, .pill.done-ok, .badge.ok, .tag.ok, .done, [class*="status-ok"]{
  background:#E4F8EC !important; color:#16A34A !important;
}
.pill.wait, .pill.pending, .badge.wait, .tag.warn, .badge.normal{
  background:#FEF3D9 !important; color:#B45309 !important;
}
.pill.done, .badge.info, .tag.info{
  background:#E3EEFF !important; color:#2563EB !important;
}
.badge.urgent, .tag.danger, [class*="status-err"]{
  background:#FEE9E9 !important; color:#DC2626 !important;
}

/* ============================ 6. 弹窗 / 遮罩 ============================ */
.modal-mask, .mask, .overlay, .dialog-mask, .gm-mask, .sync-mask, [class$="-overlay"]{
  background:rgba(22,32,58,.34) !important;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
.modal-card, .modal-box, .dialog, [class$="-modal"]:not(.modal-mask){
  border-radius:var(--ax-r-lg) !important;
  box-shadow:0 24px 60px rgba(30,44,90,.24) !important;
  border:1px solid rgba(237,241,249,.9) !important;
}

/* ============================ 7. 侧栏 / 导航 ============================ */
.sidebar, .side, aside[class], [class$="-sidebar"]{
  border-radius:var(--ax-r-lg);
}
.sidebar-item, .nav-item, .side-item, .menu-item{
  border-radius:var(--ax-r-sm) !important;
  transition:background .16s, color .16s;
}
.sidebar-item:hover, .nav-item:hover, .side-item:hover{
  background:#F5F8FD !important;
  color:var(--ax-ink) !important;
}
/* 选中态：品牌渐变胶囊 */
.sidebar-item.active, .nav-item.active, .side-item.active, .menu-item.active,
.sidebar-item.on, .nav-item.on{
  background:var(--ax-g-indigo) !important;
  color:#fff !important;

    if (typeof n !== 'number' || !isFinite(n)) return String(n == null ? '—' : n);
    return n.toLocaleString('zh-CN');
  }
  function seen(key) {
    try { return localStorage.getItem('ax_dash_' + key) === '1'; } catch (e) { return false; }
  }
  function remember(key) {
    try { localStorage.setItem('ax_dash_' + key, '1'); } catch (e) {}
  }

  /* ------------------------------ 图标库（内联 SVG） ------------------------------ */
  var I = {
    money: '<path d="M12 2v20"/><path d="M17 6.5c0-2-2.2-3-5-3s-4.6 1-4.6 2.8c0 4.2 9.6 2 9.6 6.4 0 2-2.2 3.1-5 3.1s-5-1.1-5-3.1"/>',
    doc: '<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    users: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 11h5M18.5 8.5v5"/>',
    chart: '<path d="M4 19V5m0 14h16"/><path d="M8 16v-5M12 16V7M16 16v-6"/>',
    check: '<path d="M5 4h14v16H5z"/><path d="m8.5 12 2.2 2.2L16 9"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    bell: '<path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/>',
    star: '<path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/>',
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 5.5v15"/><path d="M8 7.5h8M8 11h6"/>',
    game: '<rect x="3" y="7" width="18" height="11" rx="5"/><path d="M8 11.5v3M6.5 13h3M15.5 12h.01M17.5 14h.01"/>',
    cart: '<circle cx="9" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/><path d="M3 4h2l2.4 10.4h10.2L20 7H6"/>',
    bolt: '<path d="M13 2 4.5 13H11l-1 9L19.5 11H13z"/>',
    shield: '<path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"/><path d="m9 12 2 2 4-4"/>',
    robot: '<rect x="4" y="8" width="16" height="11" rx="4"/><path d="M12 4v4"/><circle cx="9" cy="13" r="1.2"/><circle cx="15" cy="13" r="1.2"/>',
    spider: '<circle cx="12" cy="12" r="3.2"/><path d="M12 8.8V4M12 15.2V20M8.8 12H4M15.2 12H20M9.5 9.5 6 6M14.5 9.5 18 6M9.5 14.5 6 18M14.5 14.5 18 18"/>',
    target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    down: '<path d="M12 5v14M5 12h14"/>',
    up: '<path d="M12 19V5M5 12h14"/>'
  };
  function svg(name) {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + (I[name] || I.star) + '</svg>';
  }
  function svgInk(name, size) {
    return '<svg width="' + (size || 16) + '" height="' + (size || 16) + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">' + (I[name] || I.star) + '</svg>';
  }

  /* ------------------------------ 数据解析 ------------------------------ */
  // 支持：value 直填 / textOf 读页面既有统计元素 / domCount 计数 / lsLen 本地存储长度 / sumTextOf 求和
  // 原则：宁可少一张卡，也不显示假数字 —— 解析不到就返回 {n:null}，卡片自动隐藏
  function toNum(txt) {
    var t = String(txt == null ? '' : txt).replace(/,/g, '').replace(/[^\d.\-]/g, '');
    var f = parseFloat(t);
    return isFinite(f) ? f : null;
  }
  function resolve(k) {
    try {
      if (k.textOf) {
        var e = document.querySelector(k.textOf);
        if (!e) return { n: null, real: false };
        var t = (e.textContent || '').trim();
        if (!t || t === '--' || t === '—') return { n: null, real: false };
        var n0 = toNum(t);
        if (n0 === null) return { n: null, real: false };
        // 保留原始写法（如 ¥1,200），比 toLocaleString 更贴近页面口径
        return { n: n0, real: true, raw: t };
      }
      if (k.sumTextOf) {
        var sum = 0, hit = false;
        document.querySelectorAll(k.sumTextOf).forEach(function (e) {
          var f = toNum(e.textContent);
          if (f !== null) { sum += f; hit = true; }
        });
        return hit ? { n: sum, real: true } : { n: null, real: false };
      }
      if (k.domCount) {
        var c = document.querySelectorAll(k.domCount).length;
        return { n: c, real: true };
      }
      if (k.lsLen) {
        var raw = localStorage.getItem(k.lsLen);
        if (!raw) return { n: null, real: false };
        var v = JSON.parse(raw);
        var len = Array.isArray(v) ? v.length : Object.keys(v || {}).length;
        return { n: len, real: true };
      }
      if (typeof k.value === 'number' || typeof k.value === 'string') return { n: k.value, real: true };
      return { n: null, real: false };
    } catch (e) { return { n: null, real: false }; }
  }

  /* ------------------------------ 迷你图表 ------------------------------ */
  function areaChart(points, color, w, h) {
    w = w || 300; h = h || 96;
    var max = Math.max.apply(null, points), min = Math.min.apply(null, points);
    var span = (max - min) || 1, pad = 8;
    var step = (w - pad * 2) / (points.length - 1 || 1);
    var pts = points.map(function (v, i) {
      return [pad + i * step, h - pad - (v - min) / span * (h - pad * 2)];
    });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var area = line + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (h - pad) + ' L' + pts[0][0].toFixed(1) + ' ' + (h - pad) + ' Z';
    var id = 'axg' + Math.random().toString(36).slice(2, 7);
    return '<svg class="ax-chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '" stop-opacity=".26"/>' +
      '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + area + '" fill="url(#' + id + ')"/>' +
      '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      pts.map(function (p) { return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="#fff" stroke="' + color + '" stroke-width="1.8"/>'; }).join('') +
      '</svg>';
  }
  function donut(items, size) {
    size = size || 132;
    var r = size / 2 - 13, cx = size / 2, cy = size / 2, C = 2 * Math.PI * r;
    var total = items.reduce(function (a, b) { return a + b.v; }, 0) || 1;
    var off = 0, segs = '';
    items.forEach(function (it) {
      var frac = it.v / total;
      segs += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + it.c +
        '" stroke-width="15" stroke-linecap="round" stroke-dasharray="' + (frac * C - 3).toFixed(2) + ' ' + C.toFixed(2) +
        '" stroke-dashoffset="' + (-off * C + C * 0.25).toFixed(2) + '"/>';
      off += frac;
    });
    var pct = items[0] ? Math.round(items[0].v / total * 1000) / 10 : 0;
    return '<div class="ax-donut"><svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#EDF1F9" stroke-width="15"/>' + segs +
      '<text x="' + cx + '" y="' + (cy - 1) + '" text-anchor="middle" font-size="19" font-weight="800" fill="#16203A">' + pct + '%</text>' +
      '<text x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle" font-size="10.5" fill="#93A0BA">' + esc(items[0] ? items[0].n : '') + '</text>' +
      '</svg><div class="ax-donut-legend">' + items.map(function (it) {
        return '<div class="it"><i style="background:' + it.c + '"></i>' + esc(it.n) + '<b>' + it.v + '</b></div>';
      }).join('') + '</div></div>';
  }

  /* ------------------------------ 定位主内容容器 ------------------------------ */
  // 绝不能挂到登录遮罩 / 弹窗遮罩里 —— 那些是 position:fixed 覆盖层
  var SKIP = /overlay|mask|modal|login|auth|dialog|drawer|toast|dropdown|popup|shade/i;
  function isOverlayish(n) {
    try {
      if (!n || n.nodeType !== 1) return true;
      var idc = (n.id || '') + ' ' + (typeof n.className === 'string' ? n.className : '');
      return SKIP.test(idc);
    } catch (e) { return true; }
  }
  /* 不能当宿主的元素：iframe/object/embed 塞不进子节点；script/style 同理 */
  var NOHOST = /^(IFRAME|OBJECT|EMBED|SCRIPT|STYLE|LINK|META|TEMPLATE|BR|HR|IMG|INPUT|TEXTAREA|SELECT)$/;
  function usableHost(n) {
    if (!n || n === document.body || n === document.documentElement) return false;
    if (NOHOST.test(n.tagName)) return false;
    if (isOverlayish(n)) return false;
    return true;
  }

  function findHost() {
    var cands = ['.main', 'main', '#main', '.content', '#content', '.container',
      '.app', '#app', '.app-main', '.layout', '.wrap', '.page', '#page'];
    for (var i = 0; i < cands.length; i++) {
      var n = document.querySelector(cands[i]);
      if (usableHost(n) && n.offsetHeight > 120) return n;
    }
    // 兜底 1：body 下「够大」且不是遮罩/不能装子节点的直接子元素
    var kids = document.body.children, best = null, first = null;
    for (var j = 0; j < kids.length; j++) {
      var k = kids[j];
      if (!usableHost(k)) continue;
      if (k.id === 'ax-dash-root') continue;
      if (!first) first = k;
      if (!best && k.offsetHeight > 240) best = k;
    }
    if (best) return best;
    if (first) return first;      // 兜底 2：没有"够大"的，就用第一个可用的子元素
    return document.body;
  }

  /* ------------------------------ 自动发现"常用功能" ------------------------------ */
  function discoverTools() {
    var out = [], used = {};
    /* 先按「确定的导航类名」取；取不够再用通用兜底扫可点元素。
       CFG.tools 可由页面配置追加优先选择器（该页专用，不影响其它页）。 */
    var sels = (CFG.tools || []).concat(['.sidebar-item', '.nav-item', '.side-item', '.menu-item', '.quick-item', '.wi', '.tool-item',
      '.lib-tab', '.subtab', '.admin-tab', '.subtabs > *', '.tab', '.seg > *', 'nav a', '.toolbar button']);
    function push(n) {
      if (!n || (n.closest && n.closest('#ax-dash-root'))) return;
      if (n.closest && n.closest('.modal-mask,.gm-mask,.sync-mask,[class$="-overlay"]')) return;
      var txt = (n.textContent || '').replace(/\s+/g, ' ').trim();
      if (!txt || txt.length > 12) return;
      if (/^[\d\s.·\-—+%()（）]+$/.test(txt)) return;      // 纯数字/符号跳过
      if (used[txt]) return;
      used[txt] = 1;
      out.push({ node: n, label: txt });
    }
    for (var i = 0; i < sels.length && out.length < 8; i++) {
      var nodes = document.querySelectorAll(sels[i]);
      for (var j = 0; j < nodes.length && out.length < 8; j++) push(nodes[j]);
    }
    if (out.length < 4) {
      /* 兜底：可见的按钮 / 链接 / 带 onclick 的短文本元素 */
      var gen = document.querySelectorAll('button, a, [role="button"], [onclick]');
      for (var k = 0; k < gen.length && out.length < 8; k++) {
        var e = gen[k];
        if (e.type === 'hidden') continue;
        if (e.offsetParent === null && e.offsetWidth === 0) continue;   // 不可见
        push(e);
      }
    }
    return out;
  }

  /* ------------------------------ 构建看板 ------------------------------ */
  function build() {
    var root = el('div', 'ax-dash');
    root.id = 'ax-dash-root';

    /* --- ① 问候顶栏 --- */
    var now = new Date();
    var hh = now.getHours();
    var hi = hh < 6 ? '夜深了' : hh < 11 ? '早上好' : hh < 13 ? '中午好' : hh < 18 ? '下午好' : '晚上好';
    var name = CFG.user || '';
    try { name = name || localStorage.getItem('ax_user') || localStorage.getItem('wb_user') || ''; } catch (e) {}
    if (name && name.length > 8) name = '';
    var wd = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][now.getDay()];
    var hero = el('div', 'ax-hero');
    hero.appendChild(el('div', '', '<div class="ax-hi">' + hi + (name ? '，' + esc(name) : '') + ' 👋</div>' +
      '<div class="ax-sub">' + esc(CFG.greet || (CFG.project ? CFG.project + ' · 今日概览' : '今日概览')) +
      ' · ' + now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + wd + '</div>'));
    var hr = el('div', 'ax-hero-r');
    (CFG.heroChips || []).forEach(function (c) {
      hr.appendChild(el('span', 'ax-chip', esc(c.t) + (c.b != null ? ' <b>' + esc(c.b) + '</b>' : '')));
    });
    hr.appendChild(el('span', 'ax-chip ax-fold', '<span class="ax-arrow">▾</span> 收起看板'));
    hero.appendChild(hr);
    root.appendChild(hero);

    var body = el('div', 'ax-dash-body');
    root.appendChild(body);

    /* --- ② KPI --- */
    var kpis = CFG.kpis || [];
    if (kpis.length) {
      var kg = el('div', 'ax-kpis');
      var shown = 0;
      kpis.forEach(function (k) {
        var r = resolve(k);
        /* 宁可少一张卡，也不显示会误导人的 0 / 假数字 */
        var zeroish = (r.n === 0 || r.n == null || r.n === '');
        if (zeroish && k.hideIfEmpty !== false) return;
        shown++;
        var shownVal = (r.raw != null && r.raw !== '') ? esc(r.raw) : (r.real ? num(r.n) : '—');
        var tail = (r.raw != null && r.raw !== '') ? '' : (k.unit ? '<em>' + esc(k.unit) + '</em>' : '');
        var card = el('div', 'ax-kpi c-' + (k.color || 'blue'));
        card.innerHTML =
          '<span class="ax-ic" style="background:var(--ax-g-' + (k.color || 'blue') + ')">' + svg(k.icon || 'star') + '</span>' +
          '<div class="ax-v">' + shownVal + tail + '</div>' +
          '<div class="ax-l">' + esc(k.label) + '</div>' +
          (k.trend ? '<div class="ax-t ' + (k.trendDir || 'flat') + '">' + esc(k.trend) + '</div>' : '');
        kg.appendChild(card);
      });
      if (shown) {
        body.appendChild(kg);
      } else {
        /* 全部无值时不留空洞：给一条克制的提示（登录/接入数据后自动出现） */
        body.appendChild(el('div', 'ax-card ax-note',
          '<div class="ax-empty">业务数据将在登录后自动汇总到这里</div>'));
      }
    }

    /* --- ③ 图表 + 洞察 行 --- */
    if (CFG.chart || CFG.insight) {
      var both = !!(CFG.chart && CFG.insight);
      var cols = el('div', 'ax-cols ' + (both ? 'c21' : 'c1'));
      if (CFG.chart) {
        var c1 = el('div', 'ax-card');
        c1.appendChild(el('div', 'ax-h', '<span class="ax-bar"></span><h3>' + esc(CFG.chart.title || '趋势') + '</h3>' +
          '<span class="ax-r">' + esc(CFG.chart.note || '近 12 期') + '</span>'));
        c1.appendChild(el('div', '', areaChart(CFG.chart.points || [4, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16], CFG.chart.color || '#6C5CE7')));
        if (CFG.chart.legend) {
          c1.appendChild(el('div', 'ax-legend', CFG.chart.legend.map(function (l) {
            return '<span><i style="background:' + l.c + '"></i>' + esc(l.n) + '</span>';
          }).join('')));
        }
        cols.appendChild(c1);
      }
      if (CFG.insight) {
        var c2 = el('div', 'ax-card');
        c2.appendChild(el('div', 'ax-h', '<span class="ax-bar"></span><h3>' + esc(CFG.insight.title || '结构洞察') + '</h3>'));
        if (CFG.insight.donut) {
          c2.appendChild(el('div', '', donut(CFG.insight.donut)));
        } else {
          /* barsFrom：运行时实时计数（真实数据）；bars：静态数值 */
          var items = CFG.insight.barsFrom
            ? CFG.insight.barsFrom.map(function (b) {
                var v = b.sel ? document.querySelectorAll(b.sel).length : (b.textOf && toNum((document.querySelector(b.textOf) || {}).textContent)) || 0;
                return { n: b.n, v: v || 0, c: b.c };
              }).filter(function (b) { return b.v > 0; })
            : (CFG.insight.bars || []);
          if (items.length) {
            var maxv = Math.max.apply(null, items.map(function (b) { return b.v; })) || 1;
            c2.appendChild(el('div', 'ax-bars', items.map(function (b) {
              return '<div class="ax-bar-row"><div class="ax-bh"><span>' + esc(b.n) + '</span><b>' + esc(b.v) + '</b></div>' +
                '<div class="ax-bar-track"><div class="ax-bar-fill" style="width:' + (b.v / maxv * 100).toFixed(1) +
                '%;background:' + (b.c || 'var(--ax-g-indigo)') + '"></div></div></div>';
            }).join('')));
          } else {
            c2.appendChild(el('div', 'ax-empty', '暂无可统计的记录'));
          }
        }
        cols.appendChild(c2);
      }
      body.appendChild(cols);
    }

    /* --- ④ 常用功能宫格（复用既有元素与其点击处理） --- */
    var tools = discoverTools();
    if (tools.length) {
      var tc = el('div', 'ax-card');
      tc.appendChild(el('div', 'ax-h', '<span class="ax-bar"></span><h3>常用功能</h3>' +
        '<span class="ax-r">点击直达 · 与原菜单同一入口</span>'));
      var grid = el('div', 'ax-tools');
      var pal = ['gb', 'gi', 'gg', 'go', 'gt', 'gr', 'gp'];
      tools.forEach(function (t, i) {
        var d = el('div', 'ax-tool');
        d.innerHTML = '<div class="ax-ti ' + pal[i % pal.length] + '">' + svgInk('bolt') + '</div>' +
          '<div class="ax-tn">' + esc(t.label) + '</div>';
        d.title = '等同于点击「' + t.label + '」';
        d.addEventListener('click', function () {
          try {
            t.node.scrollIntoView({ behavior: 'smooth', block: 'center' });
            t.node.click();
          } catch (e) {}
        });
        grid.appendChild(d);
      });
      tc.appendChild(grid);
      body.appendChild(tc);
    }

    /* --- ⑤ 折叠 --- */
    var fold = root.querySelector('.ax-fold');
    if (fold) {
      fold.addEventListener('click', function () {
        var hidden = body.classList.toggle('hidden');
        var ar = fold.querySelector('.ax-arrow');
        if (ar) ar.textContent = hidden ? '▸' : '▾';
        var t = fold.childNodes[fold.childNodes.length - 1];
        if (t && t.nodeType === 3) t.textContent = hidden ? ' 展开看板' : ' 收起看板';
      });
    }
    return root;
  }

  /* ------------------------------ 挂载 ------------------------------ */
  function mount() {
    try {
      if (document.getElementById('ax-dash-root')) return;   // 幂等
      var dash = build();
      /* 选项卡式布局（如 AI 外呼：页面由多个互斥 .wrap 标签页组成）：
         塞进任何一个 wrap 都会随标签切换而消失。CFG.after 指定锚点选择器时，
         把看板插到锚点「之后、同一层级」，使其常驻在标签内容之上。 */
      if (CFG.after) {
        var anchor = document.querySelector(CFG.after);
        if (anchor && anchor.parentNode) {
          anchor.parentNode.insertBefore(dash, anchor.nextSibling);
          dash.style.maxWidth = '1180px';
          dash.style.margin = '16px auto 16px';
          dash.style.padding = '0 24px';
          if (CFG.afterPad === false) dash.style.padding = '0';
          return;
        }
      }
      var host = findHost();
      if (!host) return;
      host.insertBefore(dash, host.firstChild);
      // 让看板随内容滚动，不遮挡既有吸顶元素
      dash.style.marginBottom = '16px';
    } catch (e) {
      if (window.console) console.warn('[aurora-dash] 挂载失败（已忽略，不影响原页面）：', e);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(mount, 60); });
  else setTimeout(mount, 60);

  // 页面是 SPA 时，视图切换后补挂一次
  window.addEventListener('hashchange', function () { setTimeout(mount, 260); });
  window.__axMount = mount;
})();
</script>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><div>销售工作台<small>保函 · 团险 · 车险</small></div></div>
    <nav class="nav" id="nav">
      <a href="#/home" data-r="home"><span class="ic">🏠</span><span class="label">首页</span></a>

/* ===================== Supabase 封装 ===================== */
async function sb(method, table, {select="*", filter="", body=null}={}){
  let url = `${SB_BASE}/${table}?select=${encodeURIComponent(select)}`;
  if(filter) url += "&" + filter;
  const res = await fetch(url,{
    method,
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",
             Prefer: method==="POST"?"return=minimal":"resolution=merge-duplicates"},
    body: body?JSON.stringify(body):undefined
  });
  if(!res.ok) throw new Error(`${method} ${table} -> ${res.status}`);
  if(method==="POST"||method==="PATCH"||method==="DELETE") return null;
  return res.json();
}
const LS = {
  get(k,fb){try{const v=localStorage.getItem("sw_"+k);return v?JSON.parse(v):fb;}catch(e){return fb;}},
  set(k,v){try{localStorage.setItem("sw_"+k,JSON.stringify(v));}catch(e){}}
};

/* 读写带本地兜底 */
async function loadQuotes(){
  try{ const r=await sb("GET","quotes",{filter:`email=eq.${ADMIN}`}); quotes=r.map(x=>x.payload); LS.set("quotes",quotes); }
  catch(e){ quotes=LS.get("quotes",[]); }
}
async function saveQuote(q){
  quotes.unshift(q); LS.set("quotes",quotes);
  try{ await sb("POST","quotes",{body:{id:q.id,email:ADMIN,line:q.line,payload:q}}); }catch(e){}
}
async function loadProjects(){
  try{ const r=await sb("GET","projects",{filter:`email=eq.${ADMIN}`}); projects=r.map(x=>x.payload); LS.set("projects",projects); }
  catch(e){ projects=LS.get("projects",[]); }
}
async function saveProject(p){
  const i=projects.findIndex(x=>x.id===p.id);
  if(i>=0) projects[i]=p; else projects.unshift(p);
  LS.set("projects",projects);
  try{ await sb("POST","projects",{body:{id:p.id,email:ADMIN,line:p.line,customer_id:p.customerId||null,payload:p,status:p.status}}); }catch(e){}
  router(); // 联动刷新（原为未定义的 render()，会导致保存后抛异常）
}
async function loadSettings(){
  try{
    const r=await sb("GET","app_settings",{select:"key,value",filter:`email=eq.${ADMIN}`});
    const m={}; r.forEach(x=>m[x.key]=x.value);
    settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),m);
    LS.set("settings",settings);
  }catch(e){ const s=LS.get("settings",null); if(s) settings=s; }
}
async function saveSetting(key,val){
  settings[key]=val; LS.set("settings",settings);
  try{ await sb("POST","app_settings",{body:{email:ADMIN,key,value:val}}); }catch(e){}
}

/* 客户：从 Supabase customers 表读取 data 字段 */
async function loadCustomers(){
  try{
    let r=await sb("GET","customers",{select:"id,data,updated_at",filter:`email=eq.${ADMIN}`});
    // 兼容历史数据：云端大量行 email 为空（实测 802 行中仅 1 行带邮箱），
    // 按邮箱过滤结果过少时回退为读取全量，避免客户一个都加载不出来。
    if(!r||r.length<5){
      const all=await sb("GET","customers",{select:"id,data,updated_at"});
      if(all&&all.length>r.length) r=all;
    }
    customers = r.map(x=>({id:x.id, ...(x.data||{})})).filter(c=>c.id);
  }catch(e){
    customers = LS.get("customers",[]);
    if(!customers.length) toast("客户云端拉取失败，且本地无缓存","err");
  }
  rebuildCustIndex();
}
function rebuildCustIndex(){ custById={}; customers.forEach(c=>custById[c.id]=c); }
async function patchCustomer(c){
  try{ await sb("PATCH","customers",{filter:`id=eq.${c.id}`,body:{data:c,updated_at:new Date().toISOString()}}); }catch(e){}
  LS.set("customers",customers);
}

/* ===================== 工具 ===================== */
function toast(msg,type=""){const t=document.createElement("div");t.className="toast "+type;t.textContent=msg;document.getElementById("toast").appendChild(t);setTimeout(()=>t.remove(),2600);}
function money(n){ if(n==null||isNaN(n)) return "—"; const v=Math.round(Number(n)); return "¥"+v.toLocaleString("zh-CN"); }
function lineBadge(l){return `<span class="badge ${LINE_CLASS[l]||''}">${l}</span>`;}
function classifyLines(c){
  if(Array.isArray(c.lines)&&c.lines.length) return c.lines;
  const set=new Set();
  (c.projects||[]).forEach(p=>{(p.need||[]).forEach(n=>{
    if(/团(意|体)|雇主|医疗/.test(n)) set.add("团险");
    else if(/车险|机动车|交强险/.test(n)) set.add("车险");
    else if(/保函|担保/.test(n)) set.add("保函");
  });});
  if(!set.size) set.add("保函");
  return [...set];
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function uid(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function thisMonth(d){const n=new Date();return d&&new Date(d).getMonth()===n.getMonth()&&new Date(d).getFullYear()===n.getFullYear();}

}

      <label>险种</label><select id="qGType"><option>团体意外险</option><option>雇主责任险</option><option>团体医疗险</option><option>团体重疾险</option></select>
      <div class="row"><div><label>参保人数</label><input id="qAmt" type="number" value="20"></div>
        <div><label>人均年保费（元）</label><input id="qPer" type="number" value="${settings.group.perCapita}"></div></div>
      <div class="row"><div><label>保障年限</label><input id="qPv" type="number" value="1"></div>
        <div><label>折扣率（1=无）</label><input id="qRate" type="number" step="0.01" value="1"></div></div>
      <label>关联客户</label><select id="qCust">${custOpts}</select>

  }else{
    f.innerHTML=`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">车险优惠计算器</h2><span class="pill">🧮 车险工具</span></div>
      <label>车牌/姓名</label><input id="cxOwner" placeholder="输入车牌或客户姓名" oninput="cxUpdate()">
      <label>关联客户（可选）</label><select id="qCust">${custOpts}</select>
      <div class="cx-taxrow">
        <label class="switch"><input type="checkbox" id="cxTax" checked onchange="cxUpdate()"><span class="slider"></span></label>
        <span>优惠按含税基数（保费 ÷ 1.06）；关闭则直接 保费 × 优惠%</span>
      </div>
      <table class="cx-table">
        <thead><tr><th>项目</th><th>保费(元)</th><th>方案A%</th><th>方案B%</th></tr></thead>
        <tbody>
          ${cxRow("交强险",true)}
          ${cxRow("车船税",false)}
          ${cxRow("商业险",true)}
          ${cxRow("驾乘险",true)}
        </tbody>
      </table>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost sm" onclick="cxClear('prem')">🧹 清除保费</button>
        <button class="btn ghost sm" onclick="cxClear('a')">🗑️ 清方案A</button>
        <button class="btn ghost sm" onclick="cxClear('b')">🧾 清方案B</button>
      </div>
      <div id="cxResult"></div>
      <p class="muted" style="font-size:11px;margin:8px 0 0">优惠 = 保费 ÷ 1.06 × 优惠%（含税基数开关可关闭）；车船税不参与优惠</p>
    </div>`;
    cxUpdate();
  }
}
function calcQuote(){
  let payload={line:qLine}, fee=0, typeLabel="", detail=[];
  if(qLine==="保函"){
    const amt=+document.getElementById("qAmt").value, pu=document.getElementById("qPu").value, pv=+document.getElementById("qPv").value;
    const rate=+document.getElementById("qRate").value;
    if(!amt||amt<=0){toast("请输入有效保函金额","err");return;}
    const months=pu==="year"?pv*12:pv;
    const base=amt*(rate/100)*(months/12);
    fee=base;
    let extras=[];
    document.querySelectorAll("#qFees input[data-fee]").forEach(i=>{const a=+i.value||0;if(a>0){extras.push({name:i.dataset.name,amount:a});fee+=a;}});
    typeLabel=settings.guaranteeRates[qType].label;
    payload={line:qLine,type:qType,typeLabel,amount:amt,periodUnit:pu,periodMonths:months,annualRate:rate,extras,fee:Math.round(fee)};
    detail=[["保函金额",money(amt)],["期限",months+" 个月"],["年费率",rate+"%"],["基准保费",money(base)],...extras.map(e=>[e.name,money(e.amount)]),["合计保费",money(fee)]];
  }else if(qLine==="团险"){
    const n=+document.getElementById("qAmt").value, per=+document.getElementById("qPer").value, y=+document.getElementById("qPv").value, disc=+document.getElementById("qRate").value||1;
    const gtype=document.getElementById("qGType").value;
    if(!n||n<=0){toast("请输入参保人数","err");return;}
    fee=n*per*y*disc;
    typeLabel=gtype;
    payload={line:qLine,type:gtype,typeLabel,count:n,perCapita:per,years:y,discount:disc,fee:Math.round(fee)};
    detail=[["险种",gtype],["参保人数",n+" 人"],["人均年保费",money(per)],["保障年限",y+" 年"],["折扣",disc],["合计保费",money(fee)]];
  }else{
    return; // 车险使用「车险优惠计算器」实时计算，不走此函数
  }
  const cid=document.getElementById("qCust").value;
  const q={id:uid("Q"),line:qLine,createdAt:new Date().toISOString(),customerId:cid||null,payload};
  window.__qcache=window.__qcache||{}; window.__qcache[q.id]=q;
  const r=document.getElementById("qResult");
  r.innerHTML=`<div class="result"><div class="muted">${lineBadge(qLine)} ${esc(typeLabel)} · 估算保费</div>
    <div class="big">${money(fee)}</div>
    ${detail.map(d=>`<div class="kv"><span class="k">${d[0]}</span><span class="v">${d[1]}</span></div>`).join("")}
    <div class="row" style="margin-top:12px">
      <button class="btn block" onclick="saveQuoteOnly('${q.id}')">保存报价</button>
      <button class="btn ghost block" onclick="quoteToProject('${q.id}')">存为项目 →</button>
    </div></div>`;
  toast("计算完成","ok");
}
function saveQuoteOnly(id){ const q=(window.__qcache||{})[id]; if(!q)return; saveQuote(q); toast("报价已保存","ok"); }
function quoteToProject(id){
  const q=(window.__qcache||{})[id]; if(!q)return;
  const p={id:uid("P"),line:q.line,createdAt:new Date().toISOString(),customerId:q.customerId||null,
    status:"已报价",fee:q.payload.fee,
    payload:{name:(q.payload.typeLabel||"报价")+" "+money(q.payload.fee),quoteId:q.id,...q.payload}};
  saveProject(p); toast("已存为项目","ok"); location.hash="#/projects";
}

/* ===== 车险优惠计算器（对齐 v193 工作台同款：优惠按不含税基数 保费÷1.06×优惠%） ===== */
function round2(n){return Math.round((Number(n)||0)*100)/100;}
function money2(n){return "¥"+round2(n).toFixed(2);}
function cxRow(name,disc){
  return `<tr>
    <td>${name}</td>
    <td><input type="number" class="cx-p" data-name="${name}" placeholder="0" oninput="cxUpdate()"></td>
    ${disc?`<td><input type="number" class="cx-a" data-name="${name}" placeholder="0" oninput="cxUpdate()"></td>
           <td><input type="number" class="cx-b" data-name="${name}" placeholder="0" oninput="cxUpdate()"></td>`
          :`<td class="center muted">—</td><td class="center muted">—</td>`}
  </tr>`;
}
function cxScheme(pcts,prem,taxOn){
  let orig=0,disc=0;
  const base=k=>taxOn?k/1.06:k; // 含税基数：保费÷1.06；关闭则直接用保费
  for(const k in prem){ orig+=prem[k]; if(k!=="车船税"&&pcts[k]) disc+=base(prem[k])*pcts[k]/100; }
  orig=round2(orig); disc=round2(disc);
  return {orig,disc,net:round2(orig-disc)};
}
function cxUpdate(){
  const prem={},pa={},pb={};
  document.querySelectorAll(".cx-p").forEach(i=>prem[i.dataset.name]=+i.value||0);
  document.querySelectorAll(".cx-a").forEach(i=>pa[i.dataset.name]=+i.value||0);
  document.querySelectorAll(".cx-b").forEach(i=>pb[i.dataset.name]=+i.value||0);
  const taxEl=document.getElementById("cxTax"); const taxOn=taxEl?taxEl.checked:true;
  const A=cxScheme(pa,prem,taxOn), B=cxScheme(pb,prem,taxOn);
  const ownerEl=document.getElementById("cxOwner");
  window.__cx={prem,aPct:pa,bPct:pb,A,B,owner:ownerEl?ownerEl.value.trim():"",taxBase:taxOn};
  const el=document.getElementById("cxResult"); if(!el)return;
  el.innerHTML=`
    <div class="cx-panel">
      <div class="kv"><span class="k"><span class="cx-tag t-a">A</span> 原总保费</span><span class="v" style="color:#2563eb">${money2(A.orig)}</span></div>
      <div class="kv"><span class="k"><span class="cx-tag t-a">A</span> 优惠金额</span><span class="v" style="color:#ef4444">- ${money2(A.disc)}</span></div>
      <div class="kv"><span class="k"><span class="cx-tag t-a">A</span> 实收金额</span><span class="v" style="color:#059669">${money2(A.net)}</span></div>
      <div class="kv"><span class="k"><span class="cx-tag t-b">B</span> 原总保费</span><span class="v" style="color:#2563eb">${money2(B.orig)}</span></div>
      <div class="kv"><span class="k"><span class="cx-tag t-b">B</span> 优惠金额</span><span class="v" style="color:#ef4444">- ${money2(B.disc)}</span></div>
      <div class="kv"><span class="k"><span class="cx-tag t-b">B</span> 实收金额</span><span class="v" style="color:#059669">${money2(B.net)}</span></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn block" onclick="cxSaveQuote()">保存报价</button>
      <button class="btn ghost block" onclick="cxSaveProject()">存为项目 →</button>
    </div>`;
}
function cxClear(what){
  const cls={prem:".cx-p",a:".cx-a",b:".cx-b"}[what];
  document.querySelectorAll(cls).forEach(i=>i.value="");
  cxUpdate();
}
function cxQuoteObj(){
  const c=window.__cx||{prem:{},aPct:{},bPct:{},A:{orig:0,disc:0,net:0},B:{orig:0,disc:0,net:0},owner:""};
  const custSel=document.getElementById("qCust");
  const useB=c.bPct&&Object.values(c.bPct).some(v=>v>0);
  const fee=useB?c.B.net:c.A.net;
  return {id:uid("Q"),line:"车险",createdAt:new Date().toISOString(),customerId:(custSel&&custSel.value)||null,
    payload:{type:"车险优惠计算器",typeLabel:"车险",owner:c.owner,prem:c.prem,aPct:c.aPct,bPct:c.bPct,taxBase:c.taxBase,
             schemeA:c.A,schemeB:c.B,fee,feeBasis:useB?"方案B实收":"方案A实收"}};
}
function cxSaveQuote(){
  const q=cxQuoteObj(); window.__qcache=window.__qcache||{}; window.__qcache[q.id]=q;
  saveQuote(q); toast("车险报价已保存","ok");
}
function cxSaveProject(){
  const q=cxQuoteObj(); window.__qcache=window.__qcache||{}; window.__qcache[q.id]=q;
  const p={id:uid("P"),line:"车险",createdAt:new Date().toISOString(),customerId:q.customerId,
    status:"已报价",fee:q.payload.fee,
    payload:{name:"车险报价 "+(q.payload.owner||"")+" "+money2(q.payload.fee),quoteId:q.id,...q.payload}};
  saveProject(p); toast("已存为项目","ok"); location.hash="#/projects";
}

/* ===================== 项目 ===================== */
let projFilter={line:"全部",status:"全部"};
function renderProjects(){
  const v=document.getElementById("view");
  const lineOpts=`<option>全部</option>`+LINES.map(l=>`<option ${projFilter.line===l?"selected":""}>${l}</option>`).join("");
  const statOpts=`<option>全部</option>`+STATUS.map(s=>`<option ${projFilter.status===s[0]?"selected":""}>${s[0]}</option>`).join("");
  const list=projects.filter(p=>(projFilter.line==="全部"||p.line===projFilter.line)&&(projFilter.status==="全部"||p.status===projFilter.status))
    .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  v.innerHTML=`
  <div class="toolbar">
    <select onchange="projFilter.line=this.value;renderProjects()">${lineOpts}</select>
    <select onchange="projFilter.status=this.value;renderProjects()">${statOpts}</select>
    <button class="btn sm" onclick="openProjectEditor()">+ 新建项目</button>
    <span class="muted" style="font-size:12px;align-self:center">共 ${projects.length} 个</span>
  </div>
  <div class="list">${list.length?list.map(p=>projCard(p)).join(""):`<div class="empty">暂无项目</div>`}</div>`;
}
function projCard(p){
  const c=p.customerId?custById[p.customerId]:null;
  return `<div class="item" onclick="openProject('${p.id}')">
    <div class="top"><span class="name">${esc(p.payload.name||"未命名")}</span><span class="st ${STATUS_CLS(p.status)}">${STATUS_LABEL(p.status)}</span></div>
    <div class="meta">${lineBadge(p.line)} ${c?`👤 ${esc(c.company||"")}`:`<span class="muted">未关联客户</span>`} · ${money(p.fee)}</div>
    <div class="meta muted" style="font-size:11px">创建 ${esc(p.createdAt.slice(0,10))}</div>
  </div>`;
}
function openProject(id){
  const p=projects.find(x=>x.id===id); if(!p)return;
  const c=p.customerId?custById[p.customerId]:null;
  openDrawer("项目 · "+esc(p.payload.name||""),`
    <div class="meta">${lineBadge(p.line)} ${c?`👤 <span class="link" onclick="openCustomer('${c.id}')">${esc(c.company||"")}</span>`:`<span class="muted">未关联客户</span>`}</div>
    <div class="sub-h">金额</div><div style="font-size:22px;font-weight:800">${money(p.fee)}</div>
    <div class="sub-h">状态流转</div>
    <div class="timeline">${STATUS.map(s=>`<button class="${p.status===s[0]?"on":""}" onclick="setProjStatus('${p.id}','${s[0]}')">${s[0]}</button>`).join("")}</div>
    <div class="sub-h">明细</div>
    ${Object.entries(p.payload).filter(([k])=>!["name","quoteId"].includes(k)).map(([k,val])=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(typeof val==="object"?JSON.stringify(val):val)}</span></div>`).join("")}
    <button class="btn ghost block" style="margin-top:14px" onclick="openProjectEditor('${p.id}')">编辑项目</button>
  `);
}
function setProjStatus(id,st){const p=projects.find(x=>x.id===id);if(!p)return;p.status=st;saveProject(p);closeDrawer();toast("状态已更新","ok");}
function openProjectEditor(id){
  const p=id?projects.find(x=>x.id===id):null;
  const custOpts=`<option value="">— 未关联 —</option>`+customers.map(c=>`<option value="${c.id}" ${p&&p.customerId===c.id?"selected":""}>${esc(c.company||c.id)}</option>`).join("");
  const lineOpts=LINES.map(l=>`<option ${p?(p.line===l?"selected":""):(l==="保函"?"selected":"")}>${l}</option>`).join("");
  openDrawer(id?"编辑项目":"新建项目",`
    <label>项目名称</label><input id="pName" value="${esc(p?p.payload.name||"":"")}" placeholder="如 某集团投标保函">
    <div class="row"><div><label>业务线</label><select id="pLine">${lineOpts}</select></div><div><label>状态</label><select id="pStatus">${STATUS.map(s=>`<option ${p?(p.status===s[0]?"selected":""):(s[0]==="已报价"?"selected":"")}>${s[0]}</option>`).join("")}</select></div></div>
    <div class="row"><div><label>金额（元）</label><input id="pFee" type="number" value="${p?p.fee||"":""}"></div><div><label>关联客户</label><select id="pCust">${custOpts}</select></div></div>
    <label>到期日（可选，用于临期提醒）</label><input id="pDue" type="date" value="${p&&p.payload.dueDate?p.payload.dueDate.slice(0,10):""}">
    <label>备注</label><textarea id="pNote" placeholder="项目说明">${esc(p?p.payload.note||"":"")}</textarea>
    <button class="btn block" style="margin-top:14px" onclick="commitProject('${id||""}')">${id?"保存修改":"创建项目"}</button>
  `);
}
function commitProject(id){
  const name=document.getElementById("pName").value.trim()||"未命名项目";
  const line=document.getElementById("pLine").value;
  const status=document.getElementById("pStatus").value;
  const fee=+document.getElementById("pFee").value||0;
  const cid=document.getElementById("pCust").value||null;
  const due=document.getElementById("pDue").value;
  const note=document.getElementById("pNote").value;
  let p;
  if(id){ p=projects.find(x=>x.id===id); p.line=line;p.status=status;p.fee=fee;p.customerId=cid;
    p.payload={...p.payload,name, dueDate:due?due+"T00:00:00":undefined, note}; }
  else{ p={id:uid("P"),line,customerId:cid,createdAt:new Date().toISOString(),status,fee,
    payload:{name,dueDate:due?due+"T00:00:00":undefined,note}}; }
  saveProject(p); closeDrawer(); toast("项目已保存","ok");
}

/* ===================== 设置 ===================== */
function renderSettings(){
  const v=document.getElementById("view");
  const rateRows=Object.entries(settings.guaranteeRates).map(([k,r])=>`
    <div class="kv"><span class="k">${r.label}</span>
      <span class="v" style="display:flex;gap:6px;align-items:center">min<input style="width:62px" type="number" step="0.01" data-rk="${k}" data-f="minRate" value="${r.minRate}">max<input style="width:62px" type="number" step="0.01" data-rk="${k}" data-f="maxRate" value="${r.maxRate}">默认<input style="width:62px" type="number" step="0.01" data-rk="${k}" data-f="defaultRate" value="${r.defaultRate}">%</span></div>`).join("");
  const feeRows=settings.extraFees.map((f,i)=>`
    <div class="kv"><span class="k"><input type="checkbox" ${f.enabled?"checked":""} onchange="toggleFee(${i},this.checked)"> ${esc(f.name)}</span>
      <span class="v"><input style="width:90px;text-align:right" type="number" value="${f.defaultAmount}" onchange="setFeeAmt(${i},this.value)"></span></div>`).join("");
  v.innerHTML=`
  <div class="grid g2">
    <div class="card">
      <h2>保函费率卡（年费率 %）</h2>${rateRows}
      <button class="btn ghost sm" style="margin-top:10px" onclick="saveRates()">保存费率卡</button>
    </div>
    <div class="card">
      <h2>附加费模板</h2>${feeRows||`<span class="muted">无</span>`}
      <button class="btn ghost sm" style="margin-top:10px" onclick="saveFees()">保存附加费</button>
    </div>
    <div class="card">
      <h2>团险默认参数</h2>
      <label>人均年保费默认（元）</label><input id="gPer" type="number" value="${settings.group.perCapita}" onchange="settings.group.perCapita=+this.value">
      <button class="btn ghost sm" style="margin-top:10px" onclick="saveSetting('group',settings.group);toast('已保存','ok')">保存</button>
    </div>
    <div class="card">
      <h2>车险报价</h2>
      <p class="muted" style="font-size:12px;margin:0 0 6px">车险使用「车险优惠计算器」：逐项录入保费，方案A/B 按优惠% 计算（不含税基数 保费÷1.06×优惠%，车船税不参与优惠），无需默认参数。</p>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <h2>数据管理</h2>
    <div class="row">
      <button class="btn ghost" onclick="exportAll()">导出全部（JSON）</button>
      <button class="btn ghost" onclick="reloadCloud()">重新拉取云端</button>
      <button class="btn ghost" onclick="clearLocal()">清空本地缓存</button>
    </div>
    <p class="muted" style="font-size:12px;margin-top:8px">云端账号：${ADMIN} · 报价/项目/设置写入 Supabase（quotes/projects/app_settings 表），客户读取自 customers 表。若未执行建表 SQL，将自动回退到浏览器本地存储。</p>
  </div>`;
}
function saveRates(){Object.entries(settings.guaranteeRates).forEach(([k,r])=>{document.querySelectorAll(`[data-rk="${k}"]`).forEach(i=>{r[i.dataset.f]=+i.value;});});saveSetting("guaranteeRates",settings.guaranteeRates);toast("费率卡已保存","ok");if(location.hash==="#/quote")renderQuote();}
function toggleFee(i,on){settings.extraFees[i].enabled=on;saveSetting("extraFees",settings.extraFees);}
function setFeeAmt(i,a){settings.extraFees[i].defaultAmount=+a;saveSetting("extraFees",settings.extraFees);}
function exportAll(){const blob=new Blob([JSON.stringify({customers,quotes,projects,settings},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="销售工作台_导出.json";a.click();toast("已导出","ok");}
function clearLocal(){["customers","quotes","projects","settings"].forEach(k=>localStorage.removeItem("sw_"+k));toast("本地缓存已清空，重新拉取中…");boot();}
async function reloadCloud(){await boot(true);toast("云端数据已刷新","ok");}

/* ===================== 抽屉 ===================== */
function openDrawer(title,html){document.getElementById("dwTitle").textContent=title;document.getElementById("dwBody").innerHTML=html;document.getElementById("mask").classList.add("open");document.getElementById("drawer").classList.add("open");}
function closeDrawer(){document.getElementById("mask").classList.remove("open");document.getElementById("drawer").classList.remove("open");}
document.getElementById("dwClose").onclick=closeDrawer;
document.getElementById("mask").onclick=closeDrawer;

/* ===================== 启动 ===================== */
async function boot(force){
  const v=document.getElementById("view"); v.innerHTML=`<div class="empty">加载中…</div>`;
  try{
    await Promise.all([loadSettings(),loadCustomers(),loadQuotes(),loadProjects()]);
    if(force) toast("已从云端重载","ok");
  }catch(e){ toast("加载异常："+e.message,"err"); }
  router();
}
boot();
</script>
