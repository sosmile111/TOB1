<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>销售工作台 · 保函 / 团险 / 车险</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
    --brand:#2563eb; --brand2:#0ea5e9; --green:#10b981; --amber:#f59e0b; --red:#ef4444;
    --slate:#64748b; --chip:#eef2ff; --shadow:0 1px 3px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  #app{display:flex;min-height:100vh}
  /* 侧边导航 */
  .sidebar{width:188px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:16px 14px 10px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--brand),var(--brand2))}
  .brand small{display:block;font-weight:400;color:var(--sub);font-size:11px;margin-top:2px}
  .nav{padding:6px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
  .nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;color:var(--sub);text-decoration:none;font-weight:500}
  .nav a .ic{width:18px;height:18px;flex:none}
  .nav a.active{background:var(--chip);color:var(--brand);font-weight:600}
  .nav a:hover{background:#f1f5f9}
  .nav .foot{margin-top:auto;padding:10px 11px;color:var(--sub);font-size:11px;border-top:1px solid var(--line)}
  /* 主区 */
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header.top{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header.top h1{margin:0;font-size:18px;font-weight:700}
  header.top p{margin:2px 0 0;color:var(--sub);font-size:12px}
  #view{padding:16px 20px 40px;max-width:1180px;width:100%}
  /* 卡片/栅格 */
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,1fr)} .sidebar{width:64px}.sidebar .label,.brand small,.nav .foot{display:none}.brand{justify-content:center}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 10px;font-size:15px;font-weight:700}
  .stat{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:12px;background:#f8fafc}
  .stat .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .stat .l{font-size:12px;color:var(--sub)}
  .quick{display:flex;flex-direction:column;justify-content:center;gap:8px;color:#fff;border:none;cursor:pointer;text-align:left;min-height:92px;border-radius:14px;padding:14px}
  .quick.blue{background:linear-gradient(135deg,var(--brand),#1d4ed8)}
  .quick.green{background:linear-gradient(135deg,#10b981,#059669)}
  .quick.amber{background:linear-gradient(135deg,#f59e0b,#d97706)}
  .quick.sky{background:linear-gradient(135deg,#0ea5e9,#0284c7)}
  .quick .t{font-weight:700;font-size:15px} .quick .s{font-size:11px;opacity:.85}
  /* 标签 */
  .badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .b-bh{background:#eff6ff;color:#2563eb} .b-tx{background:#ecfdf5;color:#059669} .b-cx{background:#fff7ed;color:#ea580c}
  .b-soe{background:#faf5ff;color:#7e22ce} .b-pri{background:#fef2f2;color:#dc2626}
  .st{display:inline-flex;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .st-0{background:#f1f5f9;color:#475569} .st-1{background:#eff6ff;color:#2563eb}
  .st-2{background:#fef9c3;color:#a16207} .st-3{background:#ecfdf5;color:#059669} .st-4{background:#fef2f2;color:#dc2626}
  /* 表单 */
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px;font-weight:600}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  textarea{resize:vertical;min-height:64px}
  .btn{border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
  .btn:hover{filter:brightness(.96)} .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:#f8fafc} .btn.sm{padding:6px 10px;font-size:12px} .btn.block{width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1;min-width:120px}
  /* 客户/列表 */
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
  .item .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .item .name{font-weight:700;font-size:15px}
  .item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--sub);font-size:12px}
  .phones{display:flex;flex-wrap:wrap;gap:6px}
  .ph{display:inline-flex;align-items:center;gap:5px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px}
  .ph .src{font-size:10px;color:var(--slate);background:#eef2f7;border-radius:4px;padding:0 4px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar input,.toolbar select{max-width:200px}
  .seg{display:inline-flex;background:#eef2f7;border-radius:9px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;padding:6px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer}
  .seg button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow)}
  .empty{text-align:center;color:var(--sub);padding:30px}
  /* 抽屉 */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;z-index:20}
  .mask.open{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:440px;max-width:92vw;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s;z-index:21;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .drawer .body{padding:14px 16px;overflow:auto;flex:1}
  .drawer .x{border:none;background:#f1f5f9;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px}
  .sub-h{font-size:12px;color:var(--sub);font-weight:700;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  /* 报价结果 */
  .result{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:12px}
  .result .big{font-size:26px;font-weight:800;color:#047857}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--sub)} .kv .v{font-weight:600}
  /* 车险优惠计算器 */
  .cx-table{width:100%;border-collapse:collapse;margin-top:4px}
  .cx-table th{font-size:12px;color:var(--sub);font-weight:700;text-align:left;padding:7px 6px;background:#f8fafc;border-bottom:1px solid var(--line)}
  .cx-table td{padding:6px 4px;border-bottom:1px dashed var(--line);font-size:13px}
  .cx-table td:first-child{font-weight:600;white-space:nowrap}
  .cx-table input{padding:7px 8px;text-align:right;font-size:13px}
  .cx-panel{background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:10px 12px;margin-top:12px}
  .cx-tag{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;margin-right:2px}
  .cx-tag.t-a{background:#2563eb} .cx-tag.t-b{background:#8b5cf6}
  .cx-taxrow{display:flex;align-items:center;gap:9px;margin:10px 0 2px;font-size:12px;color:var(--sub)}
  .switch{position:relative;display:inline-block;width:38px;height:21px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:999px;transition:.2s}
  .slider:before{content:"";position:absolute;height:15px;width:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--brand)}
  .switch input:checked + .slider:before{transform:translateX(17px)}
  /* toast */
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast{background:#111827;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .2s}
  .toast.ok{background:#047857} .toast.err{background:#b91c1c}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .muted{color:var(--sub)} .right{text-align:right} .center{text-align:center}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef2f7;color:var(--slate);font-weight:600}
  .link{color:var(--brand);cursor:pointer;font-weight:600}
  .timeline{display:flex;gap:6px;flex-wrap:wrap}
  .timeline button{flex:1;min-width:64px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:600;cursor:pointer;color:var(--sub)}
  .timeline button.on{background:var(--chip);color:var(--brand);border-color:#c7d2fe}
  .skip{color:var(--sub);font-size:12px;margin-top:8px;cursor:pointer;text-decoration:underline}
  /* 登录门禁 */
  .auth-gate{position:fixed;inset:0;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .auth-gate.hide{display:none}
  .auth-card{width:360px;max-width:94vw;background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .auth-card h2{margin:0 0 4px;font-size:19px}
  .auth-card .sub{color:var(--sub);font-size:12.5px;margin:0 0 16px}
  .auth-tabs{display:flex;gap:6px;margin-bottom:14px}
  .auth-tabs button{flex:1;border:none;background:#eef2f7;padding:8px;border-radius:9px;font-weight:600;color:var(--slate);cursor:pointer;font-size:13px}
  .auth-tabs button.on{background:var(--brand);color:#fff}
  .auth-msg{font-size:12.5px;margin-top:10px;min-height:18px}
  .auth-msg.err{color:#dc2626}.auth-msg.ok{color:#059669}
  .auth-foot{margin-top:14px;font-size:12px;color:var(--sub);text-align:center}
  .auth-foot a{color:var(--brand);cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><div>销售工作台<small>保函 · 团险 · 车险</small></div></div>
    <nav class="nav" id="nav">
      <a href="#/home" data-r="home"><span class="ic">🏠</span><span class="label">首页</span></a>
      <a href="#/customers" data-r="customers"><span class="ic">👥</span><span class="label">客户</span></a>
      <a href="#/quote" data-r="quote"><span class="ic">🧮</span><span class="label">报价</span></a>
      <a href="#/projects" data-r="projects"><span class="ic">📁</span><span class="label">项目</span></a>
      <a href="#/settings" data-r="settings"><span class="ic">⚙️</span><span class="label">设置</span></a>
      <a href="#/invites" data-r="invites" id="navInvites" style="display:none"><span class="ic">🔑</span><span class="label">邀请码</span></a>
    </nav>
    <div class="foot">数据：Supabase 云端<br>本地兜底：localStorage</div>
  </aside>
  <main>
    <header class="top"><h1 id="pageTitle">首页</h1><p id="pageSub"></p></header>
    <section id="view"></section>
  </main>
</div>
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer"><header><b id="dwTitle">详情</b><button class="x" id="dwClose">×</button></header><div class="body" id="dwBody"></div></aside>
<div id="toast"></div>
<div id="authGate" class="auth-gate hide"><div class="auth-card" id="authCard"></div></div>

<script>
/* ===================== 配置 ===================== */
const SB_KEY  = "sb_publishable_aLbA-luAVpq6JvUCN7v_JA_IOsxHg7X";
const SB_BASE = "https://ekecxzijszqemqykpmkc.supabase.co/rest/v1";
const ADMIN   = "seeyoulook@qq.com";
const LINES   = ["保函","团险","车险"];
const LINE_CLASS = {"保函":"b-bh","团险":"b-tx","车险":"b-cx"};
const STATUS = [["待跟进","st-0"],["已报价","st-1"],["进行中","st-2"],["已成交","st-3"],["已流失","st-4"]];
const STATUS_LABEL = s => (STATUS.find(x=>x[0]===s)||STATUS[0])[0];
const STATUS_CLS   = s => (STATUS.find(x=>x[0]===s)||STATUS[0])[1];

/* 默认设置（未连云端时使用） */
const DEFAULT_SETTINGS = {
  guaranteeRates:{
    bid:{label:"投标保函",minRate:.3,maxRate:1,defaultRate:.6},
    performance:{label:"履约保函",minRate:.5,maxRate:1.5,defaultRate:1},
    advance:{label:"预付款保函",minRate:.6,maxRate:1.8,defaultRate:1.2},
    quality:{label:"质保保函",minRate:.4,maxRate:1.2,defaultRate:.8}
  },
  extraFees:[{key:"bank",name:"银行手续费",defaultAmount:500,enabled:true},
             {key:"notary",name:"公证费",defaultAmount:200,enabled:false},
             {key:"express",name:"快递费",defaultAmount:30,enabled:false}],
  group:{perCapita:300}      // 团险人均年保费默认
};

/* ===================== 状态 ===================== */
let customers=[], quotes=[], projects=[], settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
let custById={};

/* ===================== Supabase 封装 ===================== */
async function sb(method, table, {select="*", filter="", body=null}={}){
  let url = `${SB_BASE}/${table}?select=${encodeURIComponent(select)}`;
  if(filter) url += "&" + filter;
  const doFetch = ()=>fetch(url,{
    method,
    headers:Object.assign(authHeaders(),{Prefer: method==="POST"?"return=minimal":"resolution=merge-duplicates"}),
    body: body?JSON.stringify(body):undefined
  });
  let res = await doFetch();
  if(res.status===401 && authToken){
    const ok=await refreshToken();
    if(ok) res = await doFetch();
  }
  if(!res.ok) throw new Error(`${method} ${table} -> ${res.status}`);
  if(method==="POST"||method==="PATCH"||method==="DELETE") return null;
  return res.json();
}
const LS = {
  get(k,fb){try{const v=localStorage.getItem("sw_"+k);return v?JSON.parse(v):fb;}catch(e){return fb;}},
  set(k,v){try{localStorage.setItem("sw_"+k,JSON.stringify(v));}catch(e){}}
};

/* ===================== 认证（邮箱登录 + 忘记密码邮箱找回） ===================== */
const SB_URL  = "https://ekecxzijszqemqykpmkc.supabase.co";
const SB_AUTH = SB_URL + "/auth/v1";
const RESET_BASE = (location.protocol.startsWith("http") ? location.origin+location.pathname : "https://sosmile111.github.io/TOB1/sales.html");
let authUser=null, authToken=null, recovering=false;
function loadAuth(){try{const s=localStorage.getItem("sw_auth");if(s){const o=JSON.parse(s);if(o&&o.access_token){authToken=o;authUser=o.user||null;return true;}}}catch(e){}return false;}
function saveAuth(o){authToken=o;authUser=o&&o.user||null;try{localStorage.setItem("sw_auth",JSON.stringify(o));}catch(e){}}
function clearAuth(){authToken=null;authUser=null;recovering=false;try{localStorage.removeItem("sw_auth");}catch(e){}try{sessionStorage.removeItem("sw_pkce_v");}catch(e){}}
function authHeaders(){const h={apikey:SB_KEY,"Content-Type":"application/json"};h.Authorization="Bearer "+(authToken&&authToken.access_token?authToken.access_token:SB_KEY);return h;}
async function refreshToken(){if(!authToken||!authToken.refresh_token)return false;try{const r=await fetch(SB_AUTH+"/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:authToken.refresh_token})});if(!r.ok)return false;const j=await r.json();saveAuth({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user});return true;}catch(e){return false;}}
async function apiAuth(path,body){return fetch(SB_AUTH+path,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});}
async function doLogin(email,pw){const r=await apiAuth("/token?grant_type=password",{email,password:pw});if(!r.ok){const e=await r.json().catch(()=>({}));return {ok:false,msg:e.msg||e.error_description||"登录失败"};}const j=await r.json();saveAuth({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user});return {ok:true};}
async function doSignup(email,pw,code){const r=await apiAuth("/signup",{email,password:pw,data:{invite_code:(code||"").toUpperCase()}});if(!r.ok){const e=await r.json().catch(()=>({}));let m=e.msg||e.error_description||"注册失败";if(/INVITE_CODE_REQUIRED/.test(m))m="请填写邀请码";else if(/INVITE_CODE_INVALID/.test(m))m="邀请码无效或已使用";return {ok:false,msg:m};}const j=await r.json();if(j.access_token){saveAuth({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user});return {ok:true,auto:true};}return {ok:true,auto:false};}
async function doForgot(email){let body={email,redirect_to:RESET_BASE};try{const v=randVerifier();const ch=await sha256B64url(v);sessionStorage.setItem("sw_pkce_v",v);body.code_challenge=ch;body.code_challenge_method="S256";}catch(e){}const r=await apiAuth("/recover",body);return {ok:r.ok};}
async function doReset(pw){if(!authToken||!authToken.access_token)return {ok:false,msg:"会话已失效，请重新申请重置邮件"};const r=await fetch(SB_AUTH+"/user",{method:"PUT",headers:{apikey:SB_KEY,Authorization:"Bearer "+authToken.access_token,"Content-Type":"application/json"},body:JSON.stringify({password:pw})});return {ok:r.ok};}
function signOut(){clearAuth();location.hash="#/home";showGate("login");}
function b64url(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function sha256B64url(str){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return b64url(d);}
function randVerifier(){const a="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";let s="";for(let i=0;i<64;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
async function authInit(){
  const h=location.hash, q=location.search;
  if(h.includes("access_token")||q.includes("code=")){ await handleRecoveryLink(); return; }
  if(loadAuth()){ enterApp(); return; }
  showGate("login");
}
async function handleRecoveryLink(){
  try{
    if(location.search.includes("code=")){
      const code=new URLSearchParams(location.search).get("code");
      const verifier=sessionStorage.getItem("sw_pkce_v");
      if(!verifier){showGate("login");authMsg("重置链接缺少验证信息，请重新申请","err");return;}
      const r=await fetch(SB_AUTH+"/token?grant_type=pkce",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({code,code_verifier:verifier})});
      if(!r.ok){showGate("login");authMsg("重置链接无效或已过期","err");return;}
      const j=await r.json(); saveAuth({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user});
    }else{
      const m=location.hash.match(/access_token=([^&]+)/); const rt=location.hash.match(/refresh_token=([^&]+)/);
      if(m){ saveAuth({access_token:decodeURIComponent(m[1]),refresh_token:rt?decodeURIComponent(rt[1]):"",user:null}); }
      else { showGate("login");authMsg("重置链接格式异常","err");return; }
    }
    recovering=true;
    try{ if(location.hash.includes("access_token")) history.replaceState(null,"",location.pathname+location.search); }catch(e){}
    showResetForm();
  }catch(e){ showGate("login");authMsg("处理重置链接出错："+e.message,"err"); }
}
function showGate(view){const g=document.getElementById("authGate");if(!g)return;g.classList.remove("hide");const card=document.getElementById("authCard");if(view==="reset"){showResetForm();return;}card.innerHTML=gateHTML(view||"login");}
function gateHTML(tab){const t=tab||"login";const tabs=`<div class="auth-tabs"><button class="${t==='login'?'on':''}" onclick="showGate('login')">登录</button><button class="${t==='register'?'on':''}" onclick="showGate('register')">注册</button></div>`;let body="";if(t==="login"){body=`<label>邮箱</label><input id="aEmail" type="email" placeholder="管理员邮箱" value="${ADMIN}"><label>密码</label><input id="aPw" type="password" placeholder="密码"><button class="btn block" style="margin-top:12px" onclick="onLogin()">登录</button><div class="auth-foot"><a onclick="showGate('forgot')">忘记密码？</a></div>`;}else if(t==="register"){body=`<label>邮箱</label><input id="aEmail" type="email" placeholder="用于登录的邮箱"><label>密码</label><input id="aPw" type="password" placeholder="至少 8 位"><label>邀请码</label><input id="aCode" type="text" placeholder="6 位邀请码（向管理员索取）" maxlength="16"><button class="btn block" style="margin-top:12px" onclick="onSignup()">注册账号</button><div class="auth-foot">需有效邀请码才能注册</div>`;}else{body=`<label>邮箱</label><input id="aEmail" type="email" placeholder="管理员邮箱" value="${ADMIN}"><button class="btn block" style="margin-top:12px" onclick="onForgot()">发送重置邮件</button><div class="auth-foot"><a onclick="showGate('login')">返回登录</a></div>`;}return `<h2>销售工作台</h2><p class="sub">保函 · 团险 · 车险 一体化工作台</p>${tabs}${body}<div class="auth-msg" id="authMsg"></div>`;}
function authMsg(m,type){const e=document.getElementById("authMsg");if(e){e.textContent=m||"";e.className="auth-msg "+(type||"");}}
function showResetForm(){const g=document.getElementById("authGate");if(!g)return;g.classList.remove("hide");document.getElementById("authCard").innerHTML=`<h2>重置密码</h2><p class="sub">请设置新密码</p><label>新密码</label><input id="aNewPw" type="password" placeholder="至少 8 位"><label>确认新密码</label><input id="aNewPw2" type="password" placeholder="再次输入"><button class="btn block" style="margin-top:12px" onclick="onReset()">确认重置</button><div class="auth-msg" id="authMsg"></div>`;}
async function onLogin(){const e=document.getElementById("aEmail").value.trim(),p=document.getElementById("aPw").value;if(!e||!p){authMsg("请输入邮箱和密码","err");return;}authMsg("登录中…");const r=await doLogin(e,p);if(r.ok){authMsg("登录成功","ok");enterApp();}else authMsg(r.msg||"登录失败","err");}
async function onSignup(){const e=document.getElementById("aEmail").value.trim(),p=document.getElementById("aPw").value,c=document.getElementById("aCode")?document.getElementById("aCode").value.trim():"";if(!e||!p){authMsg("请输入邮箱和密码","err");return;}if(!c){authMsg("请填写邀请码","err");return;}if(p.length<8){authMsg("密码至少 8 位","err");return;}authMsg("注册中…");const r=await doSignup(e,p,c);if(!r.ok){authMsg(r.msg,"err");return;}if(r.auto){authMsg("注册并登录成功","ok");enterApp();}else{authMsg("注册成功，请直接登录","ok");showGate("login");}}
async function onForgot(){authMsg("密码找回的邮件功能暂未开启。需要重置密码请联系管理员：seeyoulook@qq.com","err");}
async function onReset(){const p1=document.getElementById("aNewPw").value,p2=document.getElementById("aNewPw2").value;if(p1.length<8){authMsg("密码至少 8 位","err");return;}if(p1!==p2){authMsg("两次输入不一致","err");return;}authMsg("提交中…");const r=await doReset(p1);if(r.ok){clearAuth();showGate("login");authMsg("密码已重置成功，请用新密码登录","ok");}else authMsg(r.msg||"重置失败","err");}

/* 客户：从 Supabase customers 表读取 data 字段 */
async function loadCustomers(){
  try{
    let r=await sb("GET","customers",{select:"id,data,updated_at",filter:`email=eq.${ADMIN}`});
    // 兼容历史数据：云端大量行 email 为空（实测 802 行中仅 1 行带邮箱），
    // 按邮箱过滤结果过少时回退为读取全量，避免客户一个都加载不出来。

    customers = LS.get("customers",[]);
    if(!customers.length) toast("客户云端拉取失败，且本地无缓存","err");
  }
  rebuildCustIndex();
}
function rebuildCustIndex(){ custById={}; customers.forEach(c=>custById[c.id]=c); }
async function patchCustomer(c){
  try{ await sb("PATCH","customers",{filter:`id=eq.${c.id}`,body:{data:c,updated_at:new Date().toISOString()}}); }catch(e){}

}

/* ===================== 工具 ===================== */
function toast(msg,type=""){const t=document.createElement("div");t.className="toast "+type;t.textContent=msg;document.getElementById("toast").appendChild(t);setTimeout(()=>t.remove(),2600);}
function money(n){ if(n==null||isNaN(n)) return "—"; const v=Math.round(Number(n)); return "¥"+v.toLocaleString("zh-CN"); }
function lineBadge(l){return `<span class="badge ${LINE_CLASS[l]||''}">${l}</span>`;}
function classifyLines(c){
  if(Array.isArray(c.lines)&&c.lines.length) return c.lines;
  const set=new Set();
  (c.projects||[]).forEach(p=>{(p.need||[]).forEach(n=>{
    if(/团(意|体)|雇主|医疗/.test(n)) set.add("团险");
    else if(/车险|机动车|交强险/.test(n)) set.add("车险");
    else if(/保函|担保/.test(n)) set.add("保函");
  });});
  if(!set.size) set.add("保函");
  return [...set];
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function uid(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function thisMonth(d){const n=new Date();return d&&new Date(d).getMonth()===n.getMonth()&&new Date(d).getFullYear()===n.getFullYear();}

async function genCode(){

function calcQuote(){
  let payload={line:qLine}, fee=0, typeLabel="", detail=[];
  if(qLine==="保函"){
    const amt=+document.getElementById("qAmt").value, pu=document.getElementById("qPu").value, pv=+document.getElementById("qPv").value;
    const rate=+document.getElementById("qRate").value;
    if(!amt||amt<=0){toast("请输入有效保函金额","err");return;}
    const months=pu==="year"?pv*12:pv;
    const base=amt*(rate/100)*(months/12);
    fee=base;
    let extras=[];
    document.querySelectorAll("#qFees input[data-fee]").forEach(i=>{const a=+i.value||0;if(a>0){extras.push({name:i.dataset.name,amount:a});fee+=a;}});
    typeLabel=settings.guaranteeRates[qType].label;
    payload={line:qLine,type:qType,typeLabel,amount:amt,periodUnit:pu,periodMonths:months,annualRate:rate,extras,fee:Math.round(fee)};
    detail=[["保函金额",money(amt)],["期限",months+" 个月"],["年费率",rate+"%"],["基准保费",money(base)],...extras.map(e=>[e.name,money(e.amount)]),["合计保费",money(fee)]];
  }else if(qLine==="团险"){
    const n=+document.getElementById("qAmt").value, per=+document.getElementById("qPer").value, y=+document.getElementById("qPv").value, disc=+document.getElementById("qRate").value||1;
    const gtype=document.getElementById("qGType").value;
    if(!n||n<=0){toast("请输入参保人数","err");return;}
    fee=n*per*y*disc;
    typeLabel=gtype;
    payload={line:qLine,type:gtype,typeLabel,count:n,perCapita:per,years:y,discount:disc,fee:Math.round(fee)};
    detail=[["险种",gtype],["参保人数",n+" 人"],["人均年保费",money(per)],["保障年限",y+" 年"],["折扣",disc],["合计保费",money(fee)]];
  }else{
    return; // 车险使用「车险优惠计算器」实时计算，不走此函数
  }
  const cid=document.getElementById("qCust").value;
  const q={id:uid("Q"),line:qLine,createdAt:new Date().toISOString(),customerId:cid||null,payload};
  window.__qcache=window.__qcache||{}; window.__qcache[q.id]=q;
  const r=document.getElementById("qResult");
  r.innerHTML=`<div class="result"><div class="muted">${lineBadge(qLine)} ${esc(typeLabel)} · 估算保费</div>
    <div class="big">${money(fee)}</div>
    ${detail.map(d=>`<div class="kv"><span class="k">${d[0]}</span><span class="v">${d[1]}</span></div>`).join("")}
    <div class="row" style="margin-top:12px">
      <button class="btn block" onclick="saveQuoteOnly('${q.id}')">保存报价</button>
      <button class="btn ghost block" onclick="quoteToProject('${q.id}')">存为项目 →</button>
    </div></div>`;
  toast("计算完成","ok");
}
function saveQuoteOnly(id){ const q=(window.__qcache||{})[id]; if(!q)return; saveQuote(q); toast("报价已保存","ok"); }
function quoteToProject(id){

/* ===== 车险优惠计算器（对齐 v193 工作台同款：优惠按不含税基数 保费÷1.06×优惠%） ===== */
function round2(n){return Math.round((Number(n)||0)*100)/100;}
function money2(n){return "¥"+round2(n).toFixed(2);}
function cxRow(name,disc){
  return `<tr>
    <td>${name}</td>
    <td><input type="number" class="cx-p" data-name="${name}" placeholder="0" oninput="cxUpdate()"></td>
    ${disc?`<td><input type="number" class="cx-a" data-name="${name}" placeholder="0" oninput="cxUpdate()"></td>
           <td><input type="number" class="cx-b" data-name="${name}" placeholder="0" oninput="cxUpdate()"></td>`
          :`<td class="center muted">—</td><td class="center muted">—</td>`}
  </tr>`;
}
function cxScheme(pcts,prem,taxOn){
  let orig=0,disc=0;
  const base=k=>taxOn?k/1.06:k; // 含税基数：保费÷1.06；关闭则直接用保费
  for(const k in prem){ orig+=prem[k]; if(k!=="车船税"&&pcts[k]) disc+=base(prem[k])*pcts[k]/100; }
  orig=round2(orig); disc=round2(disc);
  return {orig,disc,net:round2(orig-disc)};
}
function cxUpdate(){
  const prem={},pa={},pb={};
  document.querySelectorAll(".cx-p").forEach(i=>prem[i.dataset.name]=+i.value||0);
  document.querySelectorAll(".cx-a").forEach(i=>pa[i.dataset.name]=+i.value||0);
  document.querySelectorAll(".cx-b").forEach(i=>pb[i.dataset.name]=+i.value||0);
  const taxEl=document.getElementById("cxTax"); const taxOn=taxEl?taxEl.checked:true;
  const A=cxScheme(pa,prem,taxOn), B=cxScheme(pb,prem,taxOn);
  const ownerEl=document.getElementById("cxOwner");
  window.__cx={prem,aPct:pa,bPct:pb,A,B,owner:ownerEl?ownerEl.value.trim():"",taxBase:taxOn};
  const el=document.getElementById("cxResult"); if(!el)return;
  el.innerHTML=`
    <div class="cx-panel">
      <div class="kv"><span class="k"><span class="cx-tag t-a">A</span> 原总保费</span><span class="v" style="color:#2563eb">${money2(A.orig)}</span></div>
      <div class="kv"><span class="k"><span class="cx-tag t-a">A</span> 优惠金额</span><span class="v" style="color:#ef4444">- ${money2(A.disc)}</span></div>
      <div class="kv"><span class="k"><span class="cx-tag t-a">A</span> 实收金额</span><span class="v" style="color:#059669">${money2(A.net)}</span></div>
      <div class="kv"><span class="k"><span class="cx-tag t-b">B</span> 原总保费</span><span class="v" style="color:#2563eb">${money2(B.orig)}</span></div>
      <div class="kv"><span class="k"><span class="cx-tag t-b">B</span> 优惠金额</span><span class="v" style="color:#ef4444">- ${money2(B.disc)}</span></div>
      <div class="kv"><span class="k"><span class="cx-tag t-b">B</span> 实收金额</span><span class="v" style="color:#059669">${money2(B.net)}</span></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn block" onclick="cxSaveQuote()">保存报价</button>
      <button class="btn ghost block" onclick="cxSaveProject()">存为项目 →</button>
    </div>`;
}
function cxClear(what){
  const cls={prem:".cx-p",a:".cx-a",b:".cx-b"}[what];
  document.querySelectorAll(cls).forEach(i=>i.value="");
  cxUpdate();
}
function cxQuoteObj(){
  const c=window.__cx||{prem:{},aPct:{},bPct:{},A:{orig:0,disc:0,net:0},B:{orig:0,disc:0,net:0},owner:""};
  const custSel=document.getElementById("qCust");

    payload:{type:"车险优惠计算器",typeLabel:"车险",owner:c.owner,prem:c.prem,aPct:c.aPct,bPct:c.bPct,taxBase:c.taxBase,
             schemeA:c.A,schemeB:c.B,fee,feeBasis:useB?"方案B实收":"方案A实收"}};
}

      <p class="muted" style="font-size:12px;margin:0 0 6px">车险使用「车险优惠计算器」：逐项录入保费，方案A/B 按优惠% 计算（不含税基数 保费÷1.06×优惠%，车船税不参与优惠），无需默认参数。</p>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <h2>数据管理</h2>
    <div class="row">
      <button class="btn ghost" onclick="exportAll()">导出全部（JSON）</button>
      <button class="btn ghost" onclick="reloadCloud()">重新拉取云端</button>
      <button class="btn ghost" onclick="clearLocal()">清空本地缓存</button>
    </div>
    <p class="muted" style="font-size:12px;margin-top:8px">云端账号：${ADMIN} · 报价/项目/设置写入 Supabase（quotes/projects/app_settings 表），客户读取自 customers 表。若未执行建表 SQL，将自动回退到浏览器本地存储。</p>
  </div>`;
}
function saveRates(){Object.entries(settings.guaranteeRates).forEach(([k,r])=>{document.querySelectorAll(`[data-rk="${k}"]`).forEach(i=>{r[i.dataset.f]=+i.value;});});saveSetting("guaranteeRates",settings.guaranteeRates);toast("费率卡已保存","ok");if(location.hash==="#/quote")renderQuote();}
function toggleFee(i,on){settings.extraFees[i].enabled=on;saveSetting("extraFees",settings.extraFees);}
function setFeeAmt(i,a){settings.extraFees[i].defaultAmount=+a;saveSetting("extraFees",settings.extraFees);}
function exportAll(){const blob=new Blob([JSON.stringify({customers,quotes,projects,settings},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="销售工作台_导出.json";a.click();toast("已导出","ok");}
function clearLocal(){["customers","quotes","projects","settings"].forEach(k=>localStorage.removeItem("sw_"+k));toast("本地缓存已清空，重新拉取中…");boot();}
async function reloadCloud(){await boot(true);toast("云端数据已刷新","ok");}

/* ===================== 抽屉 ===================== */
function openDrawer(title,html){document.getElementById("dwTitle").textContent=title;document.getElementById("dwBody").innerHTML=html;document.getElementById("mask").classList.add("open");document.getElementById("drawer").classList.add("open");}
function closeDrawer(){document.getElementById("mask").classList.remove("open");document.getElementById("drawer").classList.remove("open");}
document.getElementById("dwClose").onclick=closeDrawer;
document.getElementById("mask").onclick=closeDrawer;

/* ===================== 启动 ===================== */
async function boot(){ await authInit(); }
async function enterApp(){
  recovering=false;
  const v=document.getElementById("view"); v.innerHTML=`<div class="empty">加载中…</div>`;
  try{
    await Promise.all([loadSettings(),loadCustomers(),loadQuotes(),loadProjects()]);
  }catch(e){ toast("加载异常："+e.message,"err"); }
  const foot=document.querySelector(".sidebar .foot");
  if(foot) foot.innerHTML=(authUser&&authUser.email?authUser.email:"管理员")+'<br><span class="link" onclick="signOut()">退出登录</span>';
  const g=document.getElementById("authGate"); if(g) g.classList.add("hide");
  const ni=document.getElementById("navInvites"); if(ni) ni.style.display=(authUser&&authUser.email===ADMIN)?"flex":"none";
  router();
}
boot();
</script>
</body>
</html>
