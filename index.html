<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>TOB 工作台</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#f6f7fb;color:#1f2333;
  }
  .card{
    width:100%;max-width:460px;background:#fff;border:1px solid #e6e8f0;
    border-radius:16px;padding:28px 26px 22px;
    box-shadow:0 6px 24px rgba(31,35,51,.06);
  }
  h1{margin:0 0 6px;font-size:20px;letter-spacing:.2px}
  .sub{margin:0 0 22px;font-size:13px;color:#6b7285;line-height:1.6}
  .go{
    display:block;width:100%;text-align:center;text-decoration:none;
    background:#2f6bff;color:#fff;font-size:16px;font-weight:600;
    padding:14px 18px;border-radius:11px;border:0;cursor:pointer;
    transition:background .15s;
  }
  .go:hover{background:#2559d8}
  .go:active{background:#1f4cc0}
  .hint{
    margin-top:14px;font-size:12.5px;color:#8a90a6;line-height:1.7;
  }
  .bar{height:4px;border-radius:99px;background:#eceffa;overflow:hidden;margin:20px 0 0}
  .bar>i{display:block;height:100%;width:0;background:#2f6bff;border-radius:99px;transition:width .1s linear}
  .foot{
    margin-top:18px;padding-top:14px;border-top:1px dashed #e6e8f0;
    font-size:11.5px;color:#a6abbd;line-height:1.8;
  }
  .foot a{color:#a6abbd}
  .tag{
    display:inline-block;font-size:11px;color:#2f6bff;background:#eef3ff;
    border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>TOB 工作台<span class="tag">已升级</span></h1>
    <p class="sub">
      保函 · 团险 · 车险 一体化销售工作台<br>
      正在进入新版登录页，请稍候…
    </p>

    <a class="go" id="go" href="sales.html">立即进入新版工作台</a>

    <div class="bar"><i id="bar"></i></div>

    <p class="hint" id="hint">
      若 3 秒后没有自动跳转，请直接点击上面的蓝色按钮。
    </p>

    <div class="foot">
      首次使用请用管理员邮箱 + 密码登录；新同事需向管理员索取 6 位邀请码后注册。<br>
      忘记密码：点登录页的「忘记密码？」，用注册邮箱接收重置邮件。
      <br><br>
      旧版入口（已停用并封存）：<a href="legacy_bh_app.html">legacy_bh_app.html</a>
    </div>
  </main>

  <script>
  (function(){
    var target = "sales.html";
    var DUR = 1400;               /* 自动跳转等待时长（毫秒） */
    var bar = document.getElementById("bar");
    var hint = document.getElementById("hint");
    var t0 = Date.now();

    /* 若浏览器已经带着登录态进来，直接放行，不等待 */
    try {
      var a = localStorage.getItem("sw_auth");
      if (a) {
        var o = JSON.parse(a);
        if (o && o.access_token) DUR = 200;
      }
    } catch (e) {}

    var timer = setInterval(function(){
      var p = Math.min(1, (Date.now() - t0) / DUR);
      if (bar) bar.style.width = (p * 100) + "%";
      if (p >= 1) {
        clearInterval(timer);
        location.replace(target);
      }
    }, 40);

    /* 兜底：4 秒后仍未离开，提示手动点击 */
    setTimeout(function(){
      if (hint) hint.textContent = "自动跳转未成功，请手动点击上方蓝色按钮进入。";
    }, 4000);
  })();
  </script>
</body>
</html>
